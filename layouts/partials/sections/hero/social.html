<span>
    {{ range .Site.Params.hero.socialLinks.fontAwesomeIcons }}
    <span class="px-1">
        <a href="{{ .url }}"
            {{ if not (hasPrefix .url "#") }} target="_blank" {{ end }}
            class="btn social-icon"
        >
            <i class="{{ .icon }}"></i>
        </a>
    </span>
    {{ end }}

    {{ range .Site.Params.hero.socialLinks.customIcons }}
    <span class="px-1">
        <a href="{{ .url }}"
            {{ if not (hasPrefix .url "#") }} target="_blank" {{ end }}
            class="btn social-icon"
        >
            {{ if .iconLight }}
            <img
                src="{{ .iconLight }}"
                class="icon-light"
                alt=""
            >
            <img
                src="{{ .iconDark }}"
                class="icon-dark"
                alt=""
            >
            {{ else }}
            <img
                src="{{ .icon }}"
                alt=""
            >
            {{ end }}
        </a>
    </span>
    {{ end }}
</span>
