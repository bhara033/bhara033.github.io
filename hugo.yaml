              - Quantified parameters of safe laser operation such as Ocular Maximum Permissible Exposure, Eyewear Optical Density, Intrabeam Nominal Ocular Hazard Distance, Diffuse Nominal Hazard Zone for 5 high-power lasers and implemented them into Standard Operating Procedures for compliance with ANSI Z136.1 (Safe Use of Lasers).
              - Collaborated with researchers and safety professionals to evaluate research scope during annual RSS reviews and conduct 4 laboratory walkthroughs annually, identifying and resolving 12 potential hazards, achieving 100% review completion, and strengthening laboratory safety culture.
