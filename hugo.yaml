    content: "I'm an expert in Occupational Health and Public Health, bringing invaluable skills to support the success of the organization and its team, including proficiency in statistical programming such as Python, R, SAS and SQL, expertise in federal and state occupational safety (OSHA), mining safety (MSHA), energy (DOE) and environmental regulatory (EPA) compliance, as well as strong stakeholder communication, and presentation skills. Through harnessing big‑data, statistical modeling, and advanced analytics, I turn complex evidence into actionable insights that improve workplace safety, environmental stewardship, and community well‑being."
