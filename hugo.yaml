              - Launched HSMS’ LSR initiative, closing all identified compliance gaps for significantly improving safety culture while reducing incident risk as well as site-level plans to achieve 2026 HESS objectives through engaging employees at all levels, building cross-functional teams, and structured action tracking at 2 sites.
              - Implemented silica sampling programs across 2 sites, collecting 24 samples according to modified NIOSH 0600/7500 methods and analysing according to modified OSHA ID-142 Gravimetry/X-ray diffraction, resulting in sustained regulatory compliance through silica exposure below 25 μg/m3 (8-hr TWA), improving indoor air quality for 43 employees.
              - Conducted monthly safety meetings at 2 sites, delivering 26 engaging safety presentations to 43 employees and achieving 100% participation from all departments.
              - Established Safety Committees at 2 sites with 20 engaged employees, conducting 20 meetings that generated 10 actionable ideas for health and safety improvements planned for 2026.
              - Developed and formalized Emergency Action and Business Contingency Plans for 2 sites, covering 20 emergency scenarios, strengthened crisis response readiness, and improved emergency activation speed by approx 30% through streamlined communication workflows and trained response teams.
              - Organized and led the inaugural 2 Safety Day event, engaging 45 employees across 4 sessions and 8 interactive activities, strengthening safety culture and employee engagement, while achieving a 95% positive feedback rate.
              - Strengthened MSHA compliance by conducting a Task Training Audit for 2 sites and 43 employees, identifying 16 employees with missing Task Training certificates and saving $2,500, on avg, per violation in avoided fines.
              - Executed EPA air and water permit requirements by conducting quarterly stormwater sampling, monthly wastewater sampling, and periodic effluent discharge and air quality monitoring for 8 outfalls and 40 emission points, maintaining compliance across two sites for 15 months.

